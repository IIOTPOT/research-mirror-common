[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-mirror-common"
version = "0.1.0"
description = "Shared storage, migration, summary, and hashtag helpers for local research mirror bots."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.scripts]
research-mirror-admin = "research_mirror_common.migrate:main"
researchctl = "research_mirror_common.researchctl:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
